<style>
  :root { color-scheme: dark; --page-bg: #000000; --page-fg: #f2ead3; }
  :root[data-site-theme="light"] { color-scheme: light; --page-bg: #f2ead3; --page-fg: #000000; }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--page-fg);
    font: 400 1rem/1.6 "Rubik", sans-serif;
    overflow-x: hidden;
  }
  .s-main { padding: 0 5rem 1rem; }
  .s-main > * + * { margin-top: 1rem; }
  .s-main h1, .s-main h2 {
    margin: 0;
    font-family: "Londrina Solid", sans-serif;
    font-weight: 400;
    line-height: 1.2;
  }
  .s-main h1 { font-size: 2.75rem; padding: 1.25rem 0 0.5rem; }
  .s-main h2 { font-size: 2.25rem; padding: 1rem 0 0.25rem; scroll-margin-top: 1rem; }
  .s-main p { margin: 0; }
  @media (max-width: 640px) {
    .s-main { padding: 0 1rem 1rem; }
    .s-main h1 { font-size: 2.25rem; }
    .s-main h2 { font-size: 1.85rem; }
  }

  :root .c-site-header { --font-ui: "Rubik", sans-serif; }
  .c-pet__caption, .c-torch__hint, .c-walk__btn, .c-waves__credit, .c-loader__hint { font-family: "Rubik", sans-serif !important; }

  :root[data-site-theme="light"] .c-pet { --color-bg: #f2ead3; --color-text: #000000; }
  :root[data-site-theme="light"] .c-pet__img { filter: brightness(0); }
  :root[data-site-theme="light"] .c-waves { --color-bg: #f2ead3; --color-text: #000000; --color-line: #000000; }

  /* Thoughts: the list of pieces, and one piece (a narrower column for easier reading). */
  .s-main .s-thoughts { list-style: none; margin: 2rem 0 1rem; padding: 0; max-width: 46rem; }
  .s-thoughts li { padding: 1.25rem 0; border-top: 1px solid color-mix(in srgb, var(--page-fg) 25%, transparent); }
  .s-thoughts li:last-child { border-bottom: 1px solid color-mix(in srgb, var(--page-fg) 25%, transparent); }
  .s-thoughts a { color: inherit; text-decoration: none; }
  .s-thoughts__title { font: 400 1.75rem/1.2 "Londrina Solid", sans-serif; }
  .s-thoughts a:hover .s-thoughts__title, .s-thoughts a:focus-visible .s-thoughts__title { text-decoration: underline; text-underline-offset: 0.2em; }
  .s-thoughts li > p + p { margin-top: 0.9rem; }
  .s-thoughts time, .s-piece__date { display: block; margin: 0.25rem 0 0.5rem; font-size: 0.875rem; opacity: 0.7; }
  .s-piece { max-width: 42rem; }
  .s-piece > p + p { margin-top: 1.1rem; }
  .s-piece { font-size: 1.075rem; line-height: 1.75; }
  .s-piece .s-piece__date { margin-bottom: 1.5rem; }
  .s-piece .s-piece__back { margin-top: 2.5rem; font-size: 0.95rem; }
  .s-piece__back a { color: inherit; }

  /* Photo caption (home): sits under the edge-to-edge photo, lined up with the page text. */
  .s-photo__caption { padding: 0.6rem 5rem 0; font-size: 0.875rem; line-height: 1.5; }
  .s-photo__title { display: block; font: 400 1.25rem/1.25 "Londrina Solid", sans-serif; font-style: normal; }
  .s-photo__details { display: block; opacity: 0.7; }
  @media (max-width: 640px) { .s-photo__caption { padding: 0.5rem 1rem 0; } }

  /* Comic: panels in reading order, three across (two on tablets, one on phones). The drawing is
     a mask over the page's text colour, so the lines are cream on black or black on cream. */
  .s-comic { padding-top: 2rem; }
  .s-main .s-comic__date { margin: 0.25rem 0 1.5rem; font-size: 0.875rem; opacity: 0.7; }
  .s-comic__panels {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem;
  }
  .s-comic__panels li { margin: 0; }
  .s-comic__panel {
    display: block;
    aspect-ratio: 1197 / 1500;
    background: var(--page-fg);
    -webkit-mask: var(--panel) center / contain no-repeat;
    mask: var(--panel) center / contain no-repeat;
  }
  @media (max-width: 900px) { .s-comic__panels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .s-comic__panels { grid-template-columns: 1fr; gap: 1rem; } }

  /* Gallery (Moments): pictures in columns (three on wide screens, one on phones), each with a
     title, date, place and note.
     Pictures keep their own shape and colours. */
  .s-gallery { padding-top: 1.5rem; }
  .s-gallery__items { list-style: none; margin: 1rem 0 0; padding: 0; columns: 3 18rem; column-gap: 2rem; }
  .s-gallery__items li { margin: 0 0 2.25rem; break-inside: avoid; }
  .s-gallery__items figure { margin: 0; }
  .s-gallery__items img { display: block; width: 100%; height: auto; }
  .s-gallery__items figcaption { padding-top: 0.6rem; font-size: 0.875rem; line-height: 1.5; }
  .s-gallery__title { display: block; font: 400 1.25rem/1.25 "Londrina Solid", sans-serif; font-style: normal; }
  .s-gallery__date, .s-gallery__note { display: block; }
  .s-gallery__date { opacity: 0.7; }
  .s-gallery__note { margin-top: 0.25rem; }

  /* Project: a link to something built, with a line about it. */
  .s-project { padding-top: 1.5rem; }
  .s-project__title { margin-bottom: 0.25rem; }
  .s-project__title a { color: inherit; text-decoration: underline; text-underline-offset: 0.2em; }
  .s-project__arrow { display: inline-block; transition: transform 0.25s ease; }
  .s-project__title a:hover .s-project__arrow, .s-project__title a:focus-visible .s-project__arrow { transform: translate(0.15em, -0.15em); }
  @media (prefers-reduced-motion: reduce) { .s-project__arrow { transition: none; } }
  .s-visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Next: the link to the following page, at the end of each page. */
  .s-main .s-next-wrap { margin: 3rem 0 1rem; text-align: right; }
  .s-next {
    display: inline-block; padding: 0; border: 0; background: none; color: inherit; cursor: pointer;
    font: 400 1.75rem/1.2 "Londrina Solid", sans-serif; text-decoration: none;
  }
  .s-next__arrow { display: inline-block; transition: transform 0.25s ease; }
  .s-next:hover, .s-next:focus-visible { text-decoration: underline; text-underline-offset: 0.2em; }
  .s-next:hover .s-next__arrow, .s-next:focus-visible .s-next__arrow { transform: translateX(0.3em); }
  @media (prefers-reduced-motion: reduce) { .s-next__arrow { transition: none; } }

  /* The opening loader only plays on the first page of a visit. */
  :root[data-logo-loader-seen] .c-loader { display: none; }

  /* Arriving from another page mid-transition: frost from the first paint until the script
     takes over (CustomPageTransition.arrive). */
  :root[data-arriving] .c-site-header__mark { opacity: 0; }
  :root[data-arriving] body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 2147482499;
    background: rgba(0, 0, 0, 0.35);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
  }
  :root[data-arriving][data-site-theme="light"] body::after { background: rgba(242, 234, 211, 0.35); }
</style>
</head>

<style>
  .c-site-header {
    --color-bg: #000000;
    --color-fg: #f2ead3;
    --layout-header-height: 96px;
    --layout-icon-cell: 88px;
    --layout-logo-height: calc(var(--layout-header-height) * 0.56);
    --border-hairline: 1px;
    --text-link: 15px;
    --space-menu-gap: clamp(24px, 6vw, 88px);
    --font-ui: ui-monospace, "SFMono-Regular", Menlo, monospace;
    --motion-swap: 0.25s cubic-bezier(0.16, 1, 0.3, 1);

    position: relative;
    background: var(--color-bg);
    color: var(--color-fg);
    font-family: var(--font-ui);
  }

  :root[data-site-theme="light"] .c-site-header {
    --color-bg: #f2ead3;
    --color-fg: #000000;
  }

  .c-site-header__row {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    height: var(--layout-header-height);
    border-bottom: var(--border-hairline) solid currentColor;
  }

  .c-site-header__cell {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
    border-right: var(--border-hairline) solid currentColor;
    background: transparent;
    color: inherit;
    font: inherit;
    text-decoration: none;
    cursor: pointer;
  }

  .c-site-header__cell:last-child {
    border-right: 0;
  }

  .c-site-header[data-enhanced] .c-site-header__row,
  .c-site-header[data-enhanced] .c-site-header__cell {
    border-color: transparent;
  }

  /* With interactions.js the hover fill is an SVG shape that follows the moving lines. */
  .c-site-header[data-enhanced] .c-site-header__logo,
  .c-site-header[data-enhanced] .c-site-header__icon {
    background: transparent !important;
  }

  .c-site-header__fill {
    opacity: 0;
    transition: opacity var(--motion-swap);
  }

  .c-site-header__fill[data-on] {
    opacity: 1;
  }

  .c-site-header__logo {
    padding: 0 clamp(16px, 2.4vw, 32px);
    perspective: 400px;
    transition: background-color var(--motion-swap), color var(--motion-swap);
  }

  .c-site-header__logo:hover,
  .c-site-header__logo:focus-visible,
  .c-site-header__logo[data-active] {
    background: var(--color-fg);
    color: var(--color-bg);
    outline: none;
  }

  .c-site-header__mark {
    display: flex;
    align-items: center;
    height: 100%;
    will-change: transform;
    transition: opacity 0.3s ease;
  }

  .c-site-header[data-waiting] .c-site-header__mark,
  :root[data-page-transition] .c-site-header__mark {
    opacity: 0;
    transition: none;
  }

  .c-site-header__logo svg {
    display: block;
    /* A set width as well as height: iOS Safari gives a % height / auto width SVG no width,
       so the cell shrank to its padding and the divider line ran through the logo. */
    height: var(--layout-logo-height);
    width: calc(var(--layout-logo-height) * 1037 / 1157);
    flex: none;
    overflow: visible;
  }

  .c-site-header__menu {
    gap: var(--space-menu-gap);
    cursor: default;
  }

  .c-site-header__link {
    margin: 0;
    padding: 0.5em 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    font-size: var(--text-link);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 0% 1px;
    background-position: 0 85%;
    background-repeat: no-repeat;
    transition: background-size var(--motion-swap);
  }

  .c-site-header__link:hover,
  .c-site-header__link:focus-visible,
  .c-site-header__link[aria-expanded="true"] {
    background-size: 100% 1px;
    outline: none;
  }

  .c-site-header__icon {
    width: var(--layout-icon-cell);
    font-size: 26px;
    font-weight: 700;
    font-family: system-ui, sans-serif;
    letter-spacing: -0.02em;
    transition: background-color var(--motion-swap), color var(--motion-swap);
  }

  .c-site-header__icon:hover,
  .c-site-header__icon:focus-visible {
    background: var(--color-fg);
    color: var(--color-bg);
    outline: none;
  }

  .c-site-header__half {
    display: block;
    width: 30px;
    height: 30px;
    border: 2px solid currentColor;
    border-radius: 50%;
    background: linear-gradient(90deg, currentColor 50%, transparent 50%);
  }

  /* The strip is inverted (page text colour as its background), so it reads as a drop-down
     without the rest of the page changing colour. */
  .c-site-header__contact {
    display: grid;
    grid-template-rows: 0fr;
    background: var(--color-fg);
    color: var(--color-bg);
    transition: grid-template-rows 0.45s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .c-site-header[data-contact="open"] .c-site-header__contact {
    grid-template-rows: 1fr;
    border-bottom: var(--border-hairline) solid currentColor;
  }

  .c-site-header[data-enhanced] .c-site-header__contact {
    border-color: transparent;
  }

  /* Clips the contents while the row grows from 0 to its full height. It has no padding of its
     own, so it can shrink all the way to 0; the spacing lives on __contact-body inside it. */
  .c-site-header__contact-inner {
    min-height: 0;
    overflow: hidden;
  }

  .c-site-header__contact-body {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px 20px;
    padding: 18px 16px;
    font-size: var(--text-link);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .c-site-header[data-contact="open"] .c-site-header__contact-body {
    opacity: 1;
    transform: none;
    transition-delay: 0.1s, 0s;
  }

  .c-site-header__contact-label {
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .c-site-header__email {
    color: inherit;
    font-size: clamp(16px, 2.4vw, 24px);
    overflow-wrap: anywhere;
  }

  .c-site-header__copy {
    padding: 6px 12px;
    border: var(--border-hairline) solid currentColor;
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .c-site-header__copy:hover,
  .c-site-header__copy:focus-visible {
    background: var(--color-bg);
    color: var(--color-fg);
    outline: none;
  }

  @media (max-width: 639px) {
    .c-site-header {
      --layout-header-height: 64px;
      --layout-icon-cell: 52px;
      --text-link: 11px;
      --space-menu-gap: 10px;
    }

    .c-site-header__logo {
      padding: 0 14px;
    }

    .c-site-header__link {
      letter-spacing: 0.06em;
    }

    .c-site-header__icon {
      font-size: 19px;
    }

    .c-site-header__half {
      width: 22px;
      height: 22px;
    }
  }

  @media (max-width: 359px) {
    .c-site-header {
      --text-link: 10px;
      --space-menu-gap: 8px;
      --layout-icon-cell: 46px;
    }
  }

  /* Five links (divyaduraisamy.org has Thoughts too): tighter on phones so they stay on one line
     (down to 360px wide); narrower than that, the last links drop to a second line instead of
     running into the logo. The four-link header (Streamlit) is unchanged. */
  @media (max-width: 639px) {
    .c-site-header:has(.c-site-header__menu > :nth-child(5)) {
      --text-link: 10px;
      --space-menu-gap: 6px;
      --layout-icon-cell: 42px;
    }
    .c-site-header:has(.c-site-header__menu > :nth-child(5)) .c-site-header__logo { padding: 0 9px; }
    .c-site-header__menu:has(> :nth-child(5)) {
      flex-wrap: wrap;
      align-content: center;
      row-gap: 0;
      padding: 0 4px;
    }
    .c-site-header__menu:has(> :nth-child(5)) .c-site-header__link { letter-spacing: 0.02em; }
  }

  /* Five links between phone and laptop widths (640-1023px): the usual 6vw gaps don't fit, and
     ABOUT ran into the logo and CONTACT into LinkedIn. Gaps grow from 12px at 640 to 42px at 1023
     instead, so there is always space on both sides. */
  @media (min-width: 640px) and (max-width: 1023px) {
    .c-site-header:has(.c-site-header__menu > :nth-child(5)) {
      --space-menu-gap: clamp(12px, calc(8vw - 40px), 88px);
    }
  }
  /* The narrowest of those (640-767px) also need the letters a little closer. */
  @media (min-width: 640px) and (max-width: 767px) {
    .c-site-header__menu:has(> :nth-child(5)) .c-site-header__link { letter-spacing: 0.08em; }
  }

  /* Six links (Moments added): a little smaller and closer from 640 to 1199px, so the row never
     reaches the logo or LinkedIn. Narrower screens use the phone rules above. */
  @media (min-width: 640px) and (max-width: 767px) {
    .c-site-header:has(.c-site-header__menu > :nth-child(6)) { --text-link: 12px; --space-menu-gap: clamp(8px, calc(10vw - 54px), 40px); }
    .c-site-header__menu:has(> :nth-child(6)) .c-site-header__link { letter-spacing: 0.04em; }
  }
  @media (min-width: 768px) and (max-width: 1023px) {
    .c-site-header:has(.c-site-header__menu > :nth-child(6)) { --text-link: 13px; --space-menu-gap: clamp(12px, calc(10vw - 60px), 60px); }
    .c-site-header__menu:has(> :nth-child(6)) .c-site-header__link { letter-spacing: 0.08em; }
  }
  @media (min-width: 1024px) and (max-width: 1199px) {
    .c-site-header:has(.c-site-header__menu > :nth-child(6)) { --space-menu-gap: calc(8vw - 44px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .c-site-header *,
    .c-site-header__contact,
    .c-site-header__contact-body {
      transition: none !important;
    }
  }
</style>
