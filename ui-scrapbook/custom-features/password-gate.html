<!--
  Component: password-gate
  Source:    custom (written from scratch; drawing and typeface by Divya)
  Notes:     Full-screen password page shown once per browser session, after the logo loader
             (divyaduraisamy.org). Whatever the visitor types lets them in: the right phrase shows
             the whole site, anything else shows the guest version (Page/Comic with members=True
             are hidden). It runs in the browser, so it is a playful gate, not real protection.
             The box is your drawing (assets/password-box.webp, line art used as a mask, so it takes
             the page's text colour); the typing is in your handwriting (Divya's Handwriting, built
             by assets/fonts/divya-handwriting/build_font.py). The input sits exactly inside the
             drawn inner box: if you redraw the box, update --gate-field (left, top, right, bottom
             of the inner box as shares of the drawing) and the drawing's aspect ratio.
             Without interactions.js the page stays up, so always load it with this.
  Hooks:     id="c-password-gate" (CustomPasswordGate), [data-gate-form], [data-gate-input], [data-gate-message],
             [data-gate-theme] (colour switch, uses CustomSiteTheme; the choice carries over to the site),
             #c-gate-logo [data-logo] (the logo loader glides into it while the gate is up).
             <html data-gate="full|guest"> once decided; [data-members] hidden for guests,
             [data-guest-only] shown only to guests.
  Tokens:    color.bg/text, font.hand
-->
<style>
  @font-face {
    font-family: "Divyas Handwriting";
    src: url('assets/fonts/divya-handwriting.woff2') format("woff2");
    font-display: swap;
  }
  .c-gate {
    --color-bg: #000000;
    --color-text: #f2ead3;
    --font-hand: "Divyas Handwriting", "Rubik", sans-serif;
    /* the drawn inner box, as shares of the drawing: left, top, right, bottom */
    --gate-field-left: 10%;
    --gate-field-top: 59.4%;
    --gate-field-right: 12%;
    --gate-field-bottom: 18.8%;

    position: fixed;
    inset: 0;
    z-index: 2147482900;  /* under the logo loader, over everything else */
    display: grid;
    grid-template-rows: auto 1fr;
    justify-items: center;
    align-items: center;
    padding: clamp(1rem, 4vh, 2.25rem) 1rem 1rem;
    overflow-y: auto;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: "Rubik", sans-serif;
  }
  :root[data-site-theme="light"] .c-gate { --color-bg: #f2ead3; --color-text: #000000; }
  :root[data-gate] .c-gate { display: none; }
  .c-gate.is-leaving { animation: c-gate-out 0.6s cubic-bezier(0.7, 0, 0.84, 0) forwards; }
  @keyframes c-gate-out { to { opacity: 0; transform: translateY(-2%); } }
  @media (prefers-reduced-motion: reduce) { .c-gate.is-leaving { animation-duration: 0.01s; } }

  /* On short screens the drawing shrinks so the switch, drawing and "go" all fit. */
  .c-gate__form { width: min(38rem, 100%, (100vh - 18rem - 20vh) * 1.7); min-width: min(16rem, 100%); }
  .c-gate__card {
    position: relative;
    aspect-ratio: 1200 / 707;
    container-type: inline-size;
  }
  .c-gate__card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: currentColor;
    -webkit-mask: url('assets/password-box.webp') center / 100% 100% no-repeat;
    mask: url('assets/password-box.webp') center / 100% 100% no-repeat;
    pointer-events: none;
  }
  .c-gate__label {  /* the drawing already says it; this is for screen readers */
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .c-gate__input {
    position: absolute;
    left: var(--gate-field-left);
    top: var(--gate-field-top);
    right: var(--gate-field-right);
    bottom: var(--gate-field-bottom);
    width: auto;
    margin: 0;
    padding: 0 4cqi;
    border: 0;
    outline: 0;
    border-radius: 0;
    background: transparent;
    color: inherit;
    font: 400 7.2cqi/1 var(--font-hand);
    text-align: center;
    caret-color: currentColor;
    -webkit-appearance: none;
    appearance: none;
  }
  /* Drawn buttons ("go" under the drawing, the colour switch at the top): a box made from the
     inner box's linework (assets/go-box.webp; go-box-filled.webp for the fill). Hovering with a
     mouse, keyboard focus or pressing fills the box with the text colour and turns the word the
     page colour. */
  .c-gate__btn {
    position: relative;
    display: grid;
    place-items: center;
    aspect-ratio: 292 / 102;
    padding: 0 0 0.15em;
    border: 0;
    background: transparent;
    color: inherit;
    font: 400 1.9rem/1 var(--font-hand);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .c-gate__btn::before, .c-gate__btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: currentColor;
    -webkit-mask: url('assets/go-box.webp') center / 100% 100% no-repeat;
    mask: url('assets/go-box.webp') center / 100% 100% no-repeat;
  }
  .c-gate__btn::after {
    -webkit-mask-image: url('assets/go-box-filled.webp');
    mask-image: url('assets/go-box-filled.webp');
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .c-gate__btn span { position: relative; z-index: 1; transition: color 0.15s ease; }
  .c-gate__btn:focus-visible::after, .c-gate__btn:active::after { opacity: 1; }
  .c-gate__btn:focus-visible span, .c-gate__btn:active span { color: var(--color-bg); }
  @media (hover: hover) {  /* phones: no stuck fill after a tap */
    .c-gate__btn:hover::after { opacity: 1; }
    .c-gate__btn:hover span { color: var(--color-bg); }
  }
  .c-gate__btn:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; border-radius: 10px; }
  .c-gate__btn:disabled { opacity: 0.5; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .c-gate__btn::after, .c-gate__btn span { transition: none; } }

  .c-gate__go {
    width: clamp(10rem, 40%, 14rem);
    margin: 1.75rem auto 0;
    font-size: clamp(2.3rem, 7vw, 3.1rem);
  }

  /* After answering: a line in your handwriting takes the place of "go" (where they're headed). */
  .c-gate__message {
    display: none;
    margin: 1.75rem 0 0;
    min-height: 1.2em;
    font: 400 clamp(1.5rem, 5.5vw, 2.2rem)/1.2 var(--font-hand);
    text-align: center;
    text-wrap: balance;
  }
  .c-gate.is-answered .c-gate__go { display: none; }
  .c-gate.is-answered .c-gate__message { display: block; animation: c-gate-say 0.35s ease both; }
  @keyframes c-gate-say { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .c-gate.is-answered .c-gate__message { animation: none; } }

  /* Top of the page: your logo (the opening logo glides into it), then the colour switch, which
     says the colours it switches to, with a note underneath. */
  .c-gate__logo {
    display: block;
    width: clamp(4.5rem, 16vh, 8.5rem);  /* the visitor's first look at the site: big */
    aspect-ratio: 1037 / 1157;
    margin-bottom: clamp(0.5rem, 2vh, 1.25rem);
    background: currentColor;
    -webkit-mask: url('assets/logo.svg') center / contain no-repeat;
    mask: url('assets/logo.svg') center / contain no-repeat;
  }
  .c-gate__theme {
    display: grid;
    justify-items: center;
    gap: 0.35rem;
  }
  .c-gate__theme-btn { width: clamp(7.5rem, 22vw, 9rem); font-size: clamp(1.7rem, 5vw, 2.1rem); }
  .c-gate__note { margin: 0; font: 400 1.25rem/1.1 var(--font-hand); opacity: 0.8; white-space: nowrap; }
  .c-gate, .c-gate__btn::before { transition: background-color 0.3s ease, color 0.3s ease; }

  /* Guests: members-only pieces are hidden; guest-only pieces (e.g. a different Next link) appear. */
  :root[data-gate="guest"] [data-members] { display: none !important; }
  :root:not([data-gate="guest"]) [data-guest-only] { display: none !important; }
</style>
<div class="c-gate" id="c-password-gate" role="dialog" aria-modal="true" aria-labelledby="c-gate-label">
  <div class="c-gate__theme" id="c-gate-logo">
    <span class="c-gate__logo" data-logo role="img" aria-label="Divya Duraisamy"></span>
    <button class="c-gate__btn c-gate__theme-btn" type="button" data-gate-theme aria-label="Switch to light colours"><span data-gate-theme-word>light</span></button>
    <p class="c-gate__note" aria-hidden="true">switch colours</p>
  </div>
  <form class="c-gate__form" data-gate-form autocomplete="off">
    <div class="c-gate__card">
      <label class="c-gate__label" id="c-gate-label" for="c-gate-input">Enter password</label>
      <input class="c-gate__input" id="c-gate-input" data-gate-input type="text" name="phrase"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    </div>
    <button class="c-gate__btn c-gate__go" type="submit"><span>go</span></button>
    <p class="c-gate__message" data-gate-message role="status" aria-live="polite"></p>
  </form>
</div>
