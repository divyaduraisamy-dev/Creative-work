<!--
  Component: password-gate
  Source:    custom (written from scratch; drawing and typeface by Divya)
  Notes:     Full-screen password page shown once per browser session, after the logo loader
             (divyaduraisamy.org). Whatever the visitor types lets them in: the right phrase shows
             the whole site, anything else shows the guest version (Page/Comic with members=True
             are hidden). It runs in the browser, so it is a playful gate, not real protection.
             The box is your drawing (assets/password-box.webp, line art used as a mask, so it takes
             the page's text colour); the typing is in your handwriting (Divya's Handwriting, built
             by assets/fonts/divya-handwriting/build_font.py). The input sits exactly inside the
             drawn inner box: if you redraw the box, update --gate-field (left, top, right, bottom
             of the inner box as shares of the drawing) and the drawing's aspect ratio.
             Without interactions.js the page stays up, so always load it with this.
  Hooks:     id="c-password-gate" (CustomPasswordGate), [data-gate-form], [data-gate-input].
             <html data-gate="full|guest"> once decided; [data-members] hidden for guests,
             [data-guest-only] shown only to guests.
  Tokens:    color.bg/text, font.hand
-->
<style>
  @font-face {
    font-family: "Divyas Handwriting";
    src: url('assets/fonts/divya-handwriting.woff2') format("woff2");
    font-display: swap;
  }
  .c-gate {
    --color-bg: #000000;
    --color-text: #f2ead3;
    --font-hand: "Divyas Handwriting", "Rubik", sans-serif;
    /* the drawn inner box, as shares of the drawing: left, top, right, bottom */
    --gate-field-left: 10%;
    --gate-field-top: 59.4%;
    --gate-field-right: 12%;
    --gate-field-bottom: 18.8%;
    --gate-go-space: 3.5rem;

    position: fixed;
    inset: 0;
    z-index: 2147482900;  /* under the logo loader, over everything else */
    display: grid;
    place-items: center;
    padding: 1rem;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: "Rubik", sans-serif;
  }
  :root[data-site-theme="light"] .c-gate { --color-bg: #f2ead3; --color-text: #000000; }
  :root[data-gate] .c-gate { display: none; }
  .c-gate.is-leaving { animation: c-gate-out 0.6s cubic-bezier(0.7, 0, 0.84, 0) forwards; }
  @keyframes c-gate-out { to { opacity: 0; transform: translateY(-2%); } }
  @media (prefers-reduced-motion: reduce) { .c-gate.is-leaving { animation-duration: 0.01s; } }

  /* The drawing, shifted left a little so "go" fits on its right. */
  .c-gate__form {
    width: min(38rem, 100%);
    padding-right: var(--gate-go-space);
  }
  .c-gate__card {
    position: relative;
    aspect-ratio: 1200 / 707;
    container-type: inline-size;
  }
  .c-gate__card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: currentColor;
    -webkit-mask: url('assets/password-box.webp') center / 100% 100% no-repeat;
    mask: url('assets/password-box.webp') center / 100% 100% no-repeat;
    pointer-events: none;
  }
  .c-gate__label {  /* the drawing already says it; this is for screen readers */
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .c-gate__input {
    position: absolute;
    left: var(--gate-field-left);
    top: var(--gate-field-top);
    right: var(--gate-field-right);
    bottom: var(--gate-field-bottom);
    width: auto;
    margin: 0;
    padding: 0 4cqi;
    border: 0;
    outline: 0;
    border-radius: 0;
    background: transparent;
    color: inherit;
    font: 400 7.2cqi/1 var(--font-hand);
    text-align: center;
    caret-color: currentColor;
    -webkit-appearance: none;
    appearance: none;
  }
  .c-gate__go {
    position: absolute;
    left: calc(100% + 0.6rem);
    top: calc((var(--gate-field-top) + 100% - var(--gate-field-bottom)) / 2);
    transform: translateY(-50%);
    padding: 0.1em 0.3em 0.25em;
    border: 0;
    background: transparent;
    color: inherit;
    font: 400 clamp(1.9rem, 8cqi, 3rem)/1 var(--font-hand);
    cursor: pointer;
  }
  .c-gate__go:hover, .c-gate__go:focus-visible { text-decoration: underline; text-underline-offset: 0.2em; text-decoration-thickness: 2px; }
  .c-gate__go:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 6px; }
  .c-gate__go:disabled { opacity: 0.5; cursor: default; }

  /* Guests: members-only pieces are hidden; guest-only pieces (e.g. a different Next link) appear. */
  :root[data-gate="guest"] [data-members] { display: none !important; }
  :root:not([data-gate="guest"]) [data-guest-only] { display: none !important; }
</style>
<div class="c-gate" id="c-password-gate" role="dialog" aria-modal="true" aria-labelledby="c-gate-label">
  <form class="c-gate__form" data-gate-form autocomplete="off">
    <div class="c-gate__card">
      <label class="c-gate__label" id="c-gate-label" for="c-gate-input">Enter password</label>
      <input class="c-gate__input" id="c-gate-input" data-gate-input type="text" name="phrase"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button class="c-gate__go" type="submit">go</button>
    </div>
  </form>
</div>
