<!--
  Component: password-gate
  Source:    custom (written from scratch)
  Notes:     Full-screen password page shown once per browser session, after the logo loader
             (divyaduraisamy.org). Whatever the visitor types lets them in: the right phrase shows
             the whole site, anything else shows the guest version (Page/Comic with members=True
             are hidden). It runs in the browser, so it is a playful gate, not real protection.
             Later: put your handwriting font in --gate-type-font (add its @font-face here) and
             your hand-drawn box in --gate-box (a transparent line drawing; the outline is then
             left off). Without interactions.js the page stays up, so always load it with this.
  Hooks:     id="c-password-gate" (CustomPasswordGate), [data-gate-form], [data-gate-input].
             <html data-gate="full|guest"> once decided; [data-members] hidden for guests,
             [data-guest-only] shown only to guests.
  Tokens:    color.bg/text, font.type, box.image
-->
<style>
  .c-gate {
    --color-bg: #000000;
    --color-text: #f2ead3;
    --gate-type-font: "Rubik", sans-serif;   /* your handwriting font goes here */
    --gate-box: none;                         /* url('...') for the hand-drawn box */

    position: fixed;
    inset: 0;
    z-index: 2147482900;  /* under the logo loader, over everything else */
    display: grid;
    place-items: center;
    padding: 1rem;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: "Rubik", sans-serif;
  }
  :root[data-site-theme="light"] .c-gate { --color-bg: #f2ead3; --color-text: #000000; }
  :root[data-gate] .c-gate { display: none; }
  .c-gate.is-leaving { animation: c-gate-out 0.6s cubic-bezier(0.7, 0, 0.84, 0) forwards; }
  @keyframes c-gate-out { to { opacity: 0; transform: translateY(-2%); } }
  @media (prefers-reduced-motion: reduce) { .c-gate.is-leaving { animation-duration: 0.01s; } }

  .c-gate__form { width: min(30rem, 100%); text-align: center; }
  .c-gate__label {
    display: block;
    margin-bottom: 1.25rem;
    font: 400 clamp(2rem, 6vw, 2.75rem)/1.2 "Londrina Solid", sans-serif;
  }
  .c-gate__box {
    display: block;
    padding: 0.9rem 1.1rem;
    border: 1.5px solid currentColor;
    border-radius: 14px 18px 12px 20px / 18px 12px 20px 14px;  /* a little uneven, like drawn */
    background: var(--gate-box) center / 100% 100% no-repeat;
  }
  .c-gate[data-has-box] .c-gate__box { border-color: transparent; }
  .c-gate__input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: inherit;
    font: 400 1.6rem/1.3 var(--gate-type-font);
    text-align: center;
    caret-color: currentColor;
  }
  .c-gate__box:focus-within { outline: 2px solid currentColor; outline-offset: 4px; }
  .c-gate__enter {
    margin-top: 1.25rem;
    padding: 0.4rem 1.4rem;
    border: 1.5px solid currentColor;
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font: 400 1rem/1.4 "Rubik", sans-serif;
    cursor: pointer;
  }
  .c-gate__enter:hover, .c-gate__enter:focus-visible { background: var(--color-text); color: var(--color-bg); }
  .c-gate__enter:disabled { opacity: 0.5; cursor: default; }

  /* Guests: members-only pieces are hidden; guest-only pieces (e.g. a different Next link) appear. */
  :root[data-gate="guest"] [data-members] { display: none !important; }
  :root:not([data-gate="guest"]) [data-guest-only] { display: none !important; }
</style>
<div class="c-gate" id="c-password-gate" role="dialog" aria-modal="true" aria-labelledby="c-gate-label">
  <form class="c-gate__form" data-gate-form autocomplete="off">
    <label class="c-gate__label" id="c-gate-label" for="c-gate-input">Enter password</label>
    <span class="c-gate__box">
      <input class="c-gate__input" id="c-gate-input" data-gate-input type="text" name="phrase"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </span>
    <button class="c-gate__enter" type="submit">Enter</button>
  </form>
</div>
